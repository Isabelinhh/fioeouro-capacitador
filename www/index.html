<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vistoria Imobiliária</title>
<style>
  :root{
    --slate-50:#f8fafc;
    --slate-100:#f1f5f9;
    --slate-200:#e2e8f0;
    --slate-400:#94a3b8;
    --slate-500:#64748b;
    --slate-700:#334155;
    --slate-900:#0f172a;
    --red:#dc2626;
    --red-dark:#b91c1c;
    --green:#16a34a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--slate-100);
    color:var(--slate-900);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
    padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  }
  button{font-family:inherit;cursor:pointer;border:none;}
  input,textarea{font-family:inherit;}

  /* ---------- topo ---------- */
  .topbar{
    background:var(--slate-900);
    color:#fff;
    padding:calc(18px + env(safe-area-inset-top,0px)) 20px 18px;
    display:flex;align-items:center;gap:12px;
  }
  .topbar .logo{
    width:38px;height:38px;border-radius:10px;background:var(--red);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .topbar h1{font-size:1.1rem;font-weight:700;letter-spacing:.01em;}
  .topbar small{display:block;color:var(--slate-400);font-size:.78rem;font-weight:400;}

  main{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;}

  .card{
    background:#fff;border:1px solid var(--slate-200);border-radius:14px;padding:16px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .card h2{font-size:1rem;font-weight:700;color:var(--slate-900);margin-bottom:4px;}
  .card .sub{font-size:.84rem;color:var(--slate-500);margin-bottom:12px;}

  /* ---------- dados do imóvel ---------- */
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px;}
  .info-grid div span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-500);}
  .info-grid div strong{font-size:.92rem;font-weight:600;}
  .badge{
    display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;
    background:#fef3c7;color:#92400e;white-space:nowrap;
  }

  /* ---------- itens da vistoria (chips) ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    background:var(--slate-50);border:1px solid var(--slate-200);color:var(--slate-700);
    padding:9px 14px;border-radius:999px;font-size:.86rem;font-weight:600;transition:.15s;
  }
  .chip.selected{background:var(--red);border-color:var(--red);color:#fff;}

  .field{margin-top:14px;}
  .field label{display:block;font-size:.8rem;font-weight:600;color:var(--slate-700);margin-bottom:6px;}
  .field textarea{
    width:100%;min-height:78px;resize:vertical;padding:10px 12px;font-size:.92rem;
    border:1px solid var(--slate-200);border-radius:10px;background:var(--slate-50);color:var(--slate-900);
  }
  .field textarea:focus{outline:2px solid rgba(220,38,38,.35);border-color:var(--red);}

  .state-row{display:flex;gap:8px;}
  .state-row .chip{flex:1;text-align:center;padding:10px 6px;border-radius:10px;}
  .state-row .chip[data-state="Bom"].selected{background:var(--green);border-color:var(--green);}
  .state-row .chip[data-state="Regular"].selected{background:#d97706;border-color:#d97706;}
  .state-row .chip[data-state="Ruim"].selected{background:var(--red);border-color:var(--red);}

  /* ---------- câmera (classes usadas por camera.js) ---------- */
  .camera-box{
    border:1.5px dashed var(--slate-400);border-radius:12px;background:var(--slate-50);
    min-height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .camera-box.cam-error{border-color:var(--red);}
  .camera-empty{
    text-align:center;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;
  }
  .camera-empty p{color:var(--slate-500);font-size:.86rem;max-width:34ch;}
  .camera-empty svg{stroke:var(--red) !important;}
  .camera-error-msg{color:var(--red-dark);font-size:.84rem;max-width:36ch;}

  .btn-outline, .btn-red{
    padding:12px 22px;border-radius:10px;font-weight:700;font-size:.9rem;transition:.15s;
  }
  .btn-outline{background:var(--red);color:#fff;}              /* botão "Fotografar" */
  .btn-outline:hover{background:var(--red-dark);}
  .btn-outline:disabled{opacity:.6;}
  .btn-red{background:var(--slate-900);color:#fff;width:100%;padding:14px;font-size:.95rem;}
  .btn-red:disabled{background:var(--slate-400);cursor:not-allowed;}

  .camera-result{width:100%;position:relative;}
  .camera-result img{width:100%;height:220px;object-fit:cover;display:block;}
  .camera-result-actions{
    position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:10px;align-items:center;
  }
  .camera-result-actions .btn-outline{
    background:rgba(15,23,42,.88);padding:10px 18px;font-size:.82rem;
  }
  .cam-remove{
    width:38px;height:38px;border-radius:50%;background:rgba(15,23,42,.88);color:#fff;font-size:.9rem;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- registros ---------- */
  .empty-list{color:var(--slate-500);font-size:.86rem;text-align:center;padding:10px 0;}
  .record{
    display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--slate-200);
  }
  .record:first-child{border-top:none;}
  .record img{width:72px;height:72px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--slate-200);}
  .record .noimg{
    width:72px;height:72px;border-radius:10px;background:var(--slate-100);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:.68rem;color:var(--slate-500);text-align:center;
  }
  .record h4{font-size:.92rem;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .record p{font-size:.82rem;color:var(--slate-500);margin-top:2px;}
  .tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;}
  .tag.Bom{background:var(--green);} .tag.Regular{background:#d97706;} .tag.Ruim{background:var(--red);}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
    background:var(--slate-900);color:#fff;padding:12px 20px;border-radius:10px;font-size:.88rem;
    opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;z-index:50;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
  </div>
  <div>
    <h1>Vistoria Imobiliária</h1>
    <small>Entrega de imóvel · registro fotográfico</small>
  </div>
</div>

<main>

  <!-- Dados do imóvel -->
  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <h2>Apartamento 304 · Ed. Jardins</h2>
      <span class="badge">Em andamento</span>
    </div>
    <div class="info-grid">
      <div><span>Código</span><strong>#VIS-2048</strong></div>
      <div><span>Data</span><strong id="infoDate">—</strong></div>
      <div><span>Corretor</span><strong>Equipe de campo</strong></div>
      <div><span>Registros</span><strong id="infoCount">0</strong></div>
    </div>
  </section>

  <!-- Nova vistoria -->
  <section class="card">
    <h2>Nova vistoria</h2>
    <p class="sub">Escolha o item, informe o estado e fotografe.</p>

    <div class="chips" id="itemChips"></div>

    <div class="field">
      <label>Estado</label>
      <div class="state-row" id="stateRow">
        <button type="button" class="chip" data-state="Bom">Bom</button>
        <button type="button" class="chip" data-state="Regular">Regular</button>
        <button type="button" class="chip" data-state="Ruim">Ruim</button>
      </div>
    </div>

    <div class="field">
      <label>Observações (opcional)</label>
      <textarea id="obsInput" placeholder="Ex.: mancha de umidade na parede da sala; 2 chaves entregues."></textarea>
    </div>

    <div class="field">
      <label>Foto do cômodo / chaves</label>
      <!-- Montado pelo React em camera.js (@capacitor/camera) -->
      <div id="camera-root"></div>
    </div>

    <div class="field">
      <button type="button" class="btn-red" id="saveBtn" disabled>Registrar vistoria</button>
    </div>
  </section>

  <!-- Registros -->
  <section class="card">
    <h2>Registros da vistoria</h2>
    <div id="recordList"><p class="empty-list">Nenhum item registrado ainda.</p></div>
  </section>

</main>

<div id="toast"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="camera.js"></script>
<script>
/* ========================================================
   Vistoria Imobiliária — lógica da página (em memória)
   A foto vem do componente React em camera.js, que chama
   window.onPhotoChange(webPath) sempre que a foto muda.
   ======================================================== */

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}
window.showToast = toast;

const ITEMS = ['Paredes','Chaves','Piso','Teto','Portas','Janelas','Banheiro','Cozinha'];

let currentItem = null;
let currentState = null;
let capturedPhoto = null;   // webPath da foto atual
const records = [];

window.onPhotoChange = (webPath) => { capturedPhoto = webPath; };

document.getElementById('infoDate').textContent =
  new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});

// ---------- chips de item ----------
const itemChips = document.getElementById('itemChips');
ITEMS.forEach(name => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.textContent = name;
  b.addEventListener('click', () => {
    itemChips.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    b.classList.add('selected');
    currentItem = name;
    updateSave();
  });
  itemChips.appendChild(b);
});

// ---------- estado ----------
document.querySelectorAll('#stateRow .chip').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#stateRow .chip').forEach(c => c.classList.remove('selected'));
    b.classList.add('selected');
    currentState = b.dataset.state;
    updateSave();
  });
});

const saveBtn = document.getElementById('saveBtn');
function updateSave(){
  saveBtn.disabled = !(currentItem && currentState);
}

// ---------- registrar ----------
saveBtn.addEventListener('click', () => {
  const obs = document.getElementById('obsInput').value.trim();
  records.unshift({
    item: currentItem,
    state: currentState,
    obs,
    photo: capturedPhoto,
    time: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
  });
  renderRecords();
  toast(capturedPhoto ? 'Vistoria registrada com foto.' : 'Vistoria registrada (sem foto).');

  // limpa o formulário
  currentItem = null; currentState = null; capturedPhoto = null;
  itemChips.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('#stateRow .chip').forEach(c => c.classList.remove('selected'));
  document.getElementById('obsInput').value = '';
  if(window.cameraApi) window.cameraApi.reset();
  updateSave();
});

function renderRecords(){
  const list = document.getElementById('recordList');
  document.getElementById('infoCount').textContent = records.length;
  if(!records.length){
    list.innerHTML = '<p class="empty-list">Nenhum item registrado ainda.</p>';
    return;
  }
  list.innerHTML = '';
  records.forEach(r => {
    const row = document.createElement('div');
    row.className = 'record';

    let thumb;
    if(r.photo){
      thumb = document.createElement('img');
      thumb.src = r.photo;
      thumb.alt = 'Foto de ' + r.item;
    }else{
      thumb = document.createElement('div');
      thumb.className = 'noimg';
      thumb.textContent = 'sem foto';
    }

    const info = document.createElement('div');
    const h4 = document.createElement('h4');
    h4.textContent = r.item + ' ';
    const tag = document.createElement('span');
    tag.className = 'tag ' + r.state;
    tag.textContent = r.state;
    h4.appendChild(tag);
    const p1 = document.createElement('p');
    p1.textContent = r.obs || 'Sem observações.';
    const p2 = document.createElement('p');
    p2.textContent = 'Registrado às ' + r.time;
    info.append(h4, p1, p2);

    row.append(thumb, info);
    list.appendChild(row);
  });
}
</script>
</body>
</html>
